<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>LedictGBM-2 – AI Predictor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <h1>LedictGBM-2</h1>
    <div class="subtitle">Universal Prediction Engine — add your columns, any names, any order.</div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="btn-group">
        <button class="btn" id="addColumnBtn">+ Add Column</button>
        <button class="btn btn-secondary" id="addMeanColumnsBtn">Add Remaining with Mean</button>
        <button class="btn btn-danger" id="clearAllBtn">Clear All</button>
        <button class="btn btn-primary" id="predictBtn">Predict</button>
      </div>
      <div class="settings-group">
        <button class="btn btn-settings" id="settingsToggle">⚙️ Settings</button>
        <div class="settings-dropdown" id="settingsDropdown" style="display:none;">
          <div class="setting-item">
            <label for="darkToggle">Dark Mode</label>
            <input type="checkbox" id="darkToggle" />
          </div>
          <div class="setting-item">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect">
              <option value="blue">Blue</option>
              <option value="red">Red</option>
              <option value="pink">Pink</option>
              <option value="orange">Orange</option>
              <option value="purple">Purple</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Column list -->
    <div id="columnContainer" class="column-grid"></div>

    <!-- Status -->
    <div class="status-bar">
      <span>Columns: <span id="colCount" class="count">0</span> / 50</span>
      <span id="statusMessage">Ready</span>
    </div>

    <!-- Result card -->
    <div id="resultCard" class="result-card">
      <div class="result-prediction" id="resultPrediction">-</div>
      <div class="result-confidence" id="resultConfidence">Confidence: -</div>
      <div class="result-probs" id="resultProbs"></div>
      <div class="result-data-quality" id="resultDataQuality">Data quality: -</div>
    </div>

    <!-- Error -->
    <div id="errorMessage" class="error-message"></div>

    <div class="footer">Powered by LedictGBM-2 · Column‑agnostic AI</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
